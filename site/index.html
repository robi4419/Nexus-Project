<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Tech Job Skills</title>
  <meta name="description" content="A Power BI report on the skills job postings ask for, what they pay, and which skills are rising, refreshed every night.">
  <!-- No JobPosting structured data on purpose: Himalayas' terms forbid passing its jobs on through it. The source
       credits, including "Data sourced from Himalayas" with its link, are in the report's footer on every page. -->
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #f9f7f2;
    }
    /* The report fills the whole window; dvh follows mobile browsers' changing toolbar height. */
    iframe {
      display: block;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      border: 0;
    }
  </style>
</head>
<body>
  <!-- The embed code from Power BI's Publish to web (Phase 5, 5.6). If the embed ever stops (for example when the Pro
       licence lapses), replace the iframe with a screenshot, keeping the credits visible:
       <img src="report.png" alt="Screenshot of the report" style="width:100vw;height:100dvh;object-fit:contain"> -->
  <iframe
    title="Tech job skills report (Power BI)"
    src="https://app.powerbi.com/view?r=eyJrIjoiOTdlYTk0ZmItOGFjNS00NWI0LWE2MzQtNzdkMGM2YTQzNDk4IiwidCI6IjVhZmVlOWYzLTQ4OWMtNDE3OC1hZjBkLTdhYjk5MjExZmEyNCJ9"
    allowfullscreen></iframe>
</body>
</html>
