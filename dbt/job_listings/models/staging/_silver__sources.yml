version: 2

sources:
  - name: silver
    schema: silver
    description: "Cleaned tables built by the Databricks Job transform_jobs."
    tables:
      - name: jobs
        description: "One row per job, latest version, from Jobicy, Arbeitnow and Himalayas."
        config:
          loaded_at_field: built_at
          freshness:
            warn_after: { count: 1, period: day }
            error_after: { count: 2, period: day }
        data_tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns: [source, source_job_id]
        columns:
          - name: source
            data_tests: [not_null]
          - name: source_job_id
            data_tests: [not_null]
          - name: url
            data_tests: [not_null]
          - name: title
            data_tests: [not_null]
          - name: company_name
            data_tests: [not_null]
          - name: published_at
            data_tests: [not_null]
          - name: seniority
            data_tests: [not_null]
          - name: built_at
            data_tests: [not_null]
      - name: job_skills
        description: "One row per job x skill found in the job's title and in the description's lines about the job, not the employer's own text (skills found in the company name are excluded too)"
        data_tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns: [source, source_job_id, skill]
        columns:
          - name: source
            data_tests: [not_null]
          - name: source_job_id
            data_tests: [not_null]
          - name: skill
            data_tests: [not_null]
      - name: job_locations
        description: "One row per job x location listed, mapped to reference locations"
        data_tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns: [source, source_job_id, location_raw]
        columns:
          - name: source
            data_tests: [not_null]
          - name: source_job_id
            data_tests: [not_null]
          - name: location_raw
            data_tests: [not_null]
      - name: job_industry_predictions
        description: "One row per job: the industry model's likeliest industry and likeliest group, with their probabilities and the model version (Phase 5, decision 15). Rebuilt every run by the task silver_industries."
        data_tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns: [source, source_job_id]
        columns:
          - name: source
            data_tests: [not_null]
          - name: source_job_id
            data_tests: [not_null]
          - name: industry
            data_tests: [not_null]
          - name: industry_probability
            data_tests: [not_null]
          - name: industry_group
            data_tests: [not_null]
          - name: group_probability
            data_tests: [not_null]
      - name: industry_labels
        description: "One row per hand-labelled job, keyed by gold's job_key: its industry, and whether the model trains on it or is tested on it. Uploaded by scripts/upload_industry_labels.py and kept between runs; the post-hook of fct_job_postings deletes the rows of jobs that have left gold."
        columns:
          - name: job_key
            data_tests: [unique, not_null]
          - name: industry
            data_tests: [not_null]
      - name: ref_industry_list
        description: "One row per value a job's industry can take, with its group and sort order (industry_list.csv)"
        columns:
          - name: industry
            data_tests: [unique, not_null]
      - name: job_types
        description: "One row per job x job_type listed, mapped to reference job types"
        data_tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns: [source, source_job_id, job_type]
        columns:
          - name: source
            data_tests: [not_null]
          - name: source_job_id
            data_tests: [not_null]
          - name: job_type
            data_tests: [not_null]
      - name: ref_skills
        description: "One row per skill with its aliases/exclusions, category and case sensitive flag"
        columns:
          - name: skill
            data_tests: [unique, not_null]
      - name: ref_countries
        description: "One row per country with its country code and region"
        columns:
          - name: country_code
            data_tests: [unique, not_null]
