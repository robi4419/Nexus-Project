# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: "job_listings"
version: "1.0.0"

# This setting configures which "profile" dbt uses for this project.
profile: "job_listings"

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets: # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

# Layers: staging and intermediate are views in <schema>_staging; marts are tables in <schema>,
# which is what the dashboards read. Override per model with `{{ config(...) }}`.
models:
  job_listings:
    +persist_docs:
      relation: true
      columns: true
    staging: # 1:1 cleanup of silver sources
      +materialized: view
      +schema: staging
    intermediate: # joins and reusable logic
      +materialized: view
      +schema: staging
    marts: # dimension, fact and aggregate tables used by dashboards
      +materialized: table
      +contract: # every mart must declare each column's type; the build fails if the SQL differs
        enforced: true

vars:
  # Decision 7: warn when more than this share of salaried jobs has an implausible salary.
  max_implausible_salary_share: 0.05

seeds:
  job_listings:
    +schema: staging
    seniority_levels:
      +column_types:
        sort_order: int
